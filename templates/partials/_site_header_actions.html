{% if header_variant == 'auth' %}
    <a href="{% url 'home' %}" class="btn btn-secondary btn-sm">Back to Home</a>
{% elif user.is_authenticated %}
    <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm">{% if active_page == 'home' %}Go to Dashboard{% else %}Dashboard{% endif %}</a>
{% else %}
    <a href="{% url 'login' %}" class="btn btn-secondary btn-sm site-header-signin">Sign In</a>
    <a href="{% url 'member-signup' %}" class="btn btn-primary btn-sm">Get Started</a>
{% endif %}
