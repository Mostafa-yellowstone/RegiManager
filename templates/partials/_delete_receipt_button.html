<button type="button"
    class="btn-delete-receipt"
    data-id="{{ record.id }}"
    data-receipt="{{ record.receipt_number }}"
    title="Delete this receipt"
    aria-label="Delete receipt {{ record.receipt_number }}"
    style="
        display:inline-flex; align-items:center; justify-content:center;
        width:30px; height:30px; border-radius:7px;
        background:#fef2f2; border:1px solid #fca5a5;
        color:#dc2626; cursor:pointer; flex-shrink:0;
        transition: background 0.15s, transform 0.15s;
    "
    onmouseover="this.style.background='#fee2e2'; this.style.transform='scale(1.1)';"
    onmouseout="this.style.background='#fef2f2'; this.style.transform='scale(1)';"
>
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4h6v2"/>
    </svg>
</button>
