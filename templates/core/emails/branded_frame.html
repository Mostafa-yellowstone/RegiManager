<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#eef2ff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef2ff;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="background:#312e81;color:#ffffff;padding:22px 24px;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                                <tr>
                                    {% if logo_src %}
                                    <td style="width:72px;vertical-align:middle;padding-right:14px;">
                                        <img src="{{ logo_src }}" alt="{{ brand.name }}" width="64" style="display:block;max-width:64px;max-height:64px;border-radius:8px;background:#ffffff;">
                                    </td>
                                    {% endif %}
                                    <td style="vertical-align:middle;">
                                        <p style="margin:0 0 4px;font-size:1.15rem;font-weight:800;color:#ffffff;">{{ brand.name }}</p>
                                        {% if brand.phone or brand.email %}
                                        <p style="margin:0;font-size:0.85rem;color:#c7d2fe;line-height:1.45;">
                                            {% if brand.phone %}{{ brand.phone }}{% endif %}
                                            {% if brand.phone and brand.email %} · {% endif %}
                                            {% if brand.email %}{{ brand.email }}{% endif %}
                                        </p>
                                        {% endif %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px;font-size:1rem;line-height:1.6;color:#0f172a;">
                            {{ inner_html|safe }}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 24px 22px;text-align:center;font-size:0.8rem;color:#64748b;border-top:1px solid #e2e8f0;">
                            <p style="margin:0;">{{ brand.copyright_line }}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
