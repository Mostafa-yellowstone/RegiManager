<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #1e293b; background-color: #f8fafc; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .header { background: linear-gradient(135deg, #093de6, #4f46e5); color: #ffffff; padding: 40px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .banner-wrap { width: 100%; text-align: center; background-color: #f1f5f9; }
        .banner-img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .content { padding: 30px; font-size: 1rem; color: #334155; }
        .content p { margin-bottom: 20px; }
        .footer { font-size: 0.8rem; color: #64748b; text-align: center; padding: 25px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; }
        .footer p { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ subject }}</h1>
        </div>
        
        {% if has_image %}
        <div class="banner-wrap">
            <img src="cid:marketing_banner" alt="Campaign Banner" class="banner-img">
        </div>
        {% endif %}
        
        <div class="content">
            {{ content_html|safe }}
        </div>
        
        <div class="footer">
            <p>Sent by <strong>{{ psb_name }}</strong></p>
            {% if psb_phone %}
            <p>Contact Us: <strong>{{ psb_phone }}</strong></p>
            {% endif %}
            <p style="margin-top: 15px; font-size: 0.75rem; color: #94a3b8;">You are receiving this email because you are a client of {{ psb_name }}.</p>
        </div>
    </div>
</body>
</html>
