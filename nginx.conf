# ============================================================
# RegiManager — Production Nginx Configuration
# ============================================================
# Place this file at: /etc/nginx/sites-available/regimanager
# Then symlink:  ln -s /etc/nginx/sites-available/regimanager /etc/nginx/sites-enabled/
# Reload nginx:  sudo nginx -t && sudo systemctl reload nginx
# ============================================================

upstream django_app {
    server 127.0.0.1:8000;  # Gunicorn/Uvicorn listening on this port
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # <-- change this

    # Redirect HTTP -> HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # --------------------------------------------------------
    # UPLOAD SIZE — CRITICAL FIX FOR NETWORK ERRORS
    # Nginx default is 1MB which causes 413 errors on file uploads.
    # This must match Django's DATA_UPLOAD_MAX_MEMORY_SIZE (50MB).
    # --------------------------------------------------------
    client_max_body_size 55M;

    # --------------------------------------------------------
    # TIMEOUTS — prevent Gunicorn workers from timing out on
    # large file uploads or slow PDF generation
    # --------------------------------------------------------
    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;
    send_timeout                120s;
    client_body_timeout         120s;
    client_header_timeout       60s;
    keepalive_timeout           65s;

    # --------------------------------------------------------
    # STATIC FILES — served directly by Nginx (fast, no Django)
    # Run: python manage.py collectstatic  before deploying
    # --------------------------------------------------------
    location /static/ {
        alias /path/to/RegiManager/staticfiles/;  # <-- change to your path
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------
    # MEDIA FILES — user-uploaded documents, logos, etc.
    # --------------------------------------------------------
    location /media/ {
        alias /path/to/RegiManager/media/;  # <-- change to your path
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # Security: prevent direct execution of uploaded files
        add_header X-Content-Type-Options nosniff;
    }

    # --------------------------------------------------------
    # DJANGO APPLICATION — all other requests go to Gunicorn
    # --------------------------------------------------------
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Required headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer settings for large responses (PDF generation)
        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        # Disable buffering for uploads so progress can be tracked
        proxy_request_buffering off;
    }

    # --------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";
}

# ============================================================
# HTTPS Server Block (uncomment and configure with Certbot)
