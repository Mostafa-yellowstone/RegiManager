# ============================================================
# RegiManager — Production Nginx Configuration
# ============================================================
# Place this file at: /etc/nginx/sites-available/regimanager
# Then symlink:  ln -s /etc/nginx/sites-available/regimanager /etc/nginx/sites-enabled/
# Reload nginx:  sudo nginx -t && sudo systemctl reload nginx
# ============================================================

upstream django_app {
    server 127.0.0.1:8000;  # Gunicorn/Uvicorn listening on this port
    keepalive 32;
}

# No nginx request limits: a whole office shares one IP, so per-IP limits here turn real users away.
# Django limits only the public sign-in style forms (core/rate_limit_middleware.py) and locks
# accounts after repeated wrong passwords.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # <-- change this
    server_tokens off;

    # Redirect HTTP -> HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # --------------------------------------------------------
    # UPLOAD SIZE — CRITICAL FIX FOR NETWORK ERRORS
    # Nginx default is 1MB which causes 413 errors on file uploads.
    # This must match Django's DATA_UPLOAD_MAX_MEMORY_SIZE (50MB).
    # --------------------------------------------------------
    client_max_body_size 55M;

    # --------------------------------------------------------
    # TIMEOUTS — prevent Gunicorn workers from timing out on
    # large file uploads or slow PDF generation
    # --------------------------------------------------------
    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;
    send_timeout                120s;
    client_body_timeout         120s;
    client_header_timeout       60s;
    keepalive_timeout           65s;

    # --------------------------------------------------------
    # STATIC FILES — served directly by Nginx (fast, no Django)
    # Run: python manage.py collectstatic  before deploying
    # --------------------------------------------------------
    location /static/ {
        alias /path/to/RegiManager/staticfiles/;  # <-- change to your path
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------
    # COMPRESSION — CSS/JS/JSON/HTML are 70-85% smaller over the wire
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # --------------------------------------------------------
    # APP DOWN / RESTARTING — friendly page instead of nginx's bare "502 Bad Gateway"
    # (Django can't render its own error page when gunicorn itself is unreachable)
    # --------------------------------------------------------
    error_page 502 503 504 /__app_down.html;
    location = /__app_down.html {
        alias /path/to/RegiManager/staticfiles/errors/502.html;  # <-- change to your path
        internal;
        add_header Cache-Control "no-store";
    }

    # Health probe for uptime monitors and deploy scripts (database + cache check)
    location = /healthz/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --------------------------------------------------------
    # MEDIA FILES — user-uploaded documents, logos, etc.
    # --------------------------------------------------------
    # Uploads hold client documents (licenses, policies, IDs, signatures), so nginx asks Django
    # before serving each file: logos / profile photos / email images are public, everything
    # else needs a signed-in user (core/media_access.py). Needs ngx_http_auth_request_module,
    # which ships with the standard Ubuntu/Debian nginx packages (check: nginx -V 2>&1 | grep auth_request).
    location /media/ {
        auth_request /__media_auth;
        error_page 401 = @media_sign_in;
        alias /path/to/RegiManager/media/;  # <-- change to your path
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
        # Security: prevent direct execution of uploaded files
        add_header X-Content-Type-Options nosniff;
    }

    location = /__media_auth {
        internal;
        proxy_pass http://django_app/media-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @media_sign_in {
        return 302 /auth/login/?next=$request_uri;
    }

    # --------------------------------------------------------
    # SIGN-IN AND PUBLIC LINKS — tighter per-IP limits
    # --------------------------------------------------------
    location ~ ^/(auth/login|auth/member-signup|admin/login|api/auth/login|api/client/auth/login|contact)/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(sign|intake)/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------
    # DJANGO APPLICATION — all other requests go to Gunicorn
    # --------------------------------------------------------
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Required headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer settings for large responses (PDF generation)
        proxy_buffering         on;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        # Disable buffering for uploads so progress can be tracked
        proxy_request_buffering off;
    }

    # --------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------
    # X-Frame-Options, nosniff and Referrer-Policy come from Django (settings.py); repeating them here sends duplicates.
}

# ============================================================
# HTTPS Server Block (uncomment and configure with Certbot)
