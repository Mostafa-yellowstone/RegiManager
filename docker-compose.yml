version: '3.8'

services:
  db:
    image: postgres:16
    container_name: regi_postgres
    restart: always
    environment:
      POSTGRES_DB: regimanager
      POSTGRES_USER: regi_admin
      POSTGRES_PASSWORD: your_secure_password # CHANGE THIS
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regi_admin -d regimanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: regi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
