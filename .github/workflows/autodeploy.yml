name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: RegiManager.settings
          SECRET_KEY: ci-test-secret
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
          USE_REDIS_CACHE: "False"
        run: python manage.py test core --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Connect and deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key ${{ secrets.VPS_USER }}@${{ vars.VPS_HOST }} bash -s <<'EOF'
          set -eu
          cd "$HOME/RegiManager"
          echo "user=$(id -un) head=$(git rev-parse --short HEAD)"
          if sudo -n true; then
            sudo -n chown -R "$(id -un):$(id -gn)" "$HOME/RegiManager"
          fi
          git fetch origin main
          rm -f .git/index
          git reset --hard origin/main
          echo "HEAD is now $(git rev-parse --short HEAD)"
          bash -l /home/Projects/sc.sh || echo "sc.sh failed; the checkout is already updated"
          bash "$HOME/RegiManager/scripts/install_quote_browser.sh"
          if sudo -n true; then
            sudo -n systemctl restart regimanager.service || true
          fi
          sleep 3
          curl -sS -H 'Accept: application/json' --max-time 15 https://www.regimanager.com/healthz/ || true
          echo
          EOF
