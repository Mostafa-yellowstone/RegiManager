name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: RegiManager.settings
          SECRET_KEY: ci-test-secret
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
          USE_REDIS_CACHE: "False"
        run: python manage.py test core --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Connect and deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key ${{ secrets.VPS_USER }}@${{ vars.VPS_HOST }} bash -s <<'EOF'
          set -eu
          cd "$HOME/RegiManager"
          echo "user=$(id -un) head=$(git rev-parse --short HEAD)"
          restart_units() {
            if sudo -n true; then
              while read -r unit _; do
                case "$unit" in
                  *gunicorn*|*regimanager*|*celery*)
                    echo "Restarting $unit"
                    sudo -n systemctl restart "$unit" || true
                    ;;
                esac
              done < <(sudo -n systemctl list-units --type=service --all --no-legend --no-pager 2>/dev/null || true)
            fi
          }
          if sudo -n true; then
            echo "Giving the deploy user ownership of the app checkout"
            sudo -n chown -R "$(id -un):$(id -gn)" "$HOME/RegiManager"
          else
            echo "No passwordless sudo; continuing with the current ownership"
          fi
          if [ -d .git/objects ] && ! ( : > .git/objects/.perm-test ) 2>/dev/null; then
            echo "git objects are still not writable"
            ls -ld .git .git/objects || true
            exit 1
          fi
          rm -f .git/objects/.perm-test
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "$HOME/regi-deploy-backups"
          if [ -f RegiManager/settings.py ]; then
            cp -a RegiManager/settings.py "$HOME/regi-deploy-backups/settings-$stamp.py"
          fi
          while IFS= read -r line; do
            flag=${line:0:1}
            path=${line:2}
            case "$flag" in
              [a-z]|S)
                echo "Clearing a hidden local-edit flag on $path"
                git update-index --no-assume-unchanged --no-skip-worktree -- "$path"
                ;;
            esac
          done < <(git ls-files -v)
          echo "Worktree before reset:"
          git status --porcelain --untracked-files=no || true
          git diff --stat || true
          before=$(git rev-parse HEAD)
          git fetch origin main
          git reset --hard origin/main
          git show HEAD:RegiManager/settings.py > RegiManager/settings.py.deploy
          mv RegiManager/settings.py.deploy RegiManager/settings.py
          echo "HEAD ${before:0:7} -> $(git rev-parse --short HEAD)"
          bash -l /home/Projects/sc.sh
          git fetch origin main
          after=$(git rev-parse HEAD)
          echo "HEAD ${before:0:7} -> ${after:0:7} origin=$(git rev-parse --short origin/main)"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "The checkout is still behind origin/main"
            git status --porcelain --untracked-files=no
            exit 1
          fi
          bash "$HOME/RegiManager/scripts/install_quote_browser.sh"
          restart_units
          sleep 3
          health=$(curl -sS -H 'Accept: application/json' --max-time 15 https://www.regimanager.com/healthz/ || true)
          echo "healthz ${health:-empty}"
          case "$health" in
            *'"database": "ok"'*|*"\"database\":\"ok\""*)
              echo "Database is up"
              ;;
            *)
              echo "Database check failed after deploy"
              if [ -f "$HOME/regi-deploy-backups/settings-$stamp.py" ]; then
                echo "Restoring the previous settings.py and restarting"
                cp "$HOME/regi-deploy-backups/settings-$stamp.py" RegiManager/settings.py
                restart_units
              fi
              exit 1
              ;;
          esac
          EOF
