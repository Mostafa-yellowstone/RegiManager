name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: RegiManager.settings
          SECRET_KEY: ci-test-secret
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
          USE_REDIS_CACHE: "False"
        run: python manage.py test core --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Connect and deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key ${{ secrets.VPS_USER }}@${{ vars.VPS_HOST }} bash -s <<'EOF'
          set -u
          cd "$HOME/RegiManager"
          echo "user=$(id -un) pwd=$(pwd)"
          if sudo -n true; then
            echo "Giving the deploy user ownership of the app checkout"
            sudo -n chown -R "$(id -un):$(id -gn)" "$HOME/RegiManager"
          else
            echo "No passwordless sudo; continuing with the current ownership"
          fi
          if [ -d .git/objects ] && ! ( : > .git/objects/.perm-test ) 2>/dev/null; then
            echo "git objects are still not writable"
            ls -ld .git .git/objects || true
            exit 1
          fi
          rm -f .git/objects/.perm-test
          bash -l /home/Projects/sc.sh
          bash "$HOME/RegiManager/scripts/install_quote_browser.sh"
          if sudo -n true; then
            while read -r unit _; do
              case "$unit" in
                *gunicorn*|*regimanager*|*celery*)
                  echo "Restarting $unit"
                  sudo -n systemctl restart "$unit" || true
                  ;;
              esac
            done < <(sudo -n systemctl list-units --type=service --all --no-legend --no-pager 2>/dev/null || true)
          fi
          EOF
